
    <!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>스팜 AI - 퇴근길 리포트</title>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-color: #0f172a;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent-green: #10b981;
                --accent-blue: #3b82f6;
                --accent-purple: #8b5cf6;
                --glass-bg: rgba(255, 255, 255, 0.05);
                --glass-border: rgba(255, 255, 255, 0.1);
            }
            
            * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
            
            body {
                background: linear-gradient(135deg, #1e1b4b, #0f172a, #172554);
                background-size: 400% 400%;
                animation: gradientBG 15s ease infinite;
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
            }
            
            @keyframes gradientBG {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }
            
            .dashboard-container {
                background: var(--glass-bg);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid var(--glass-border);
                border-radius: 24px;
                padding: 3rem;
                width: 100%;
                max-width: 1000px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                animation: fadeIn 1s ease-out;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .header {
                text-align: center;
                margin-bottom: 3rem;
            }
            
            .header h1 {
                font-size: 2.5rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
                background: linear-gradient(to right, #8b5cf6, #3b82f6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            
            .header p {
                color: var(--text-muted);
                font-size: 1.1rem;
            }
            
            .summary-section {
                display: flex;
                gap: 1.5rem;
                margin-bottom: 2.5rem;
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .summary-card {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 16px;
                padding: 1.5rem 2rem;
                text-align: center;
                flex: 1;
                min-width: 120px;
                max-width: 200px;
            }
            
            .summary-card h3 {
                font-size: 1.1rem;
                color: var(--text-muted);
                margin-bottom: 0.5rem;
                font-weight: 500;
            }
            
            .summary-value {
                font-size: 2.5rem;
                font-weight: 700;
                color: var(--text-main);
            }
            
            .summary-unit {
                font-size: 1rem;
                color: var(--text-muted);
                margin-left: 0.2rem;
            }
            
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 2rem;
            }
            
            .card {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 16px;
                padding: 2rem;
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
            }
            
            .card::before {
                content: '';
                position: absolute;
                top: 0; left: 0; width: 100%; height: 4px;
                background: linear-gradient(to right, var(--accent-purple), var(--accent-blue));
                opacity: 0;
                transition: opacity 0.3s ease;
            }
            
            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
                background: rgba(255, 255, 255, 0.05);
            }
            
            .card:hover::before { opacity: 1; }
            
            .card h2 {
                font-size: 1.5rem;
                font-weight: 500;
                margin-bottom: 1.5rem;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                padding-bottom: 0.5rem;
            }
            
            .metrics { display: flex; flex-direction: column; gap: 1rem; }
            
            .metric {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .metric .label { color: var(--text-muted); }
            .metric .value { font-size: 1.8rem; font-weight: 700; }
            .metric .value.temp { color: #f87171; }
            .metric .value.hum { color: #60a5fa; }
            
            .metric-small {
                margin-top: 1rem;
                font-size: 0.9rem;
                color: var(--text-muted);
                text-align: right;
            }
            .metric-small .min { color: #9ca3af; font-weight: bold; }
            .metric-small .max { color: #f87171; font-weight: bold; }
            
            .footer {
                text-align: center;
                margin-top: 3rem;
                color: var(--text-muted);
                font-size: 0.9rem;
                opacity: 0.7;
            }
            
            .no-data {
                grid-column: 1 / -1;
                text-align: center;
                padding: 3rem;
                background: rgba(255,255,255,0.02);
                border-radius: 16px;
                color: var(--text-muted);
            }
        </style>
    </head>
    <body>
        <div class="dashboard-container">
            <div class="header">
                <h1>🌙 스팜 AI 퇴근길 리포트</h1>
                <p>오늘 (2026-05-01) 하루 동안의 요약입니다</p>
            </div>
            
            
    <div class="summary-section">
        <div class="summary-card">
            <h3>💧 관수</h3>
            <p class="summary-value">0<span class="summary-unit">회</span></p>
        </div>
        <div class="summary-card">
            <h3>🛡️ 방제</h3>
            <p class="summary-value">0<span class="summary-unit">건</span></p>
        </div>
        <div class="summary-card">
            <h3>🌱 생육조사</h3>
            <p class="summary-value">0<span class="summary-unit">건</span></p>
        </div>
    </div>
    
            
            <div class="grid">
                
            <div class="card">
                <h2>1동</h2>
                <div class="metrics">
                    <div class="metric">
                        <span class="label">평균 온도</span>
                        <span class="value temp">20.5°C</span>
                    </div>
                    <div class="metric">
                        <span class="label">평균 습도</span>
                        <span class="value hum">80.4%</span>
                    </div>
                    <div class="metric-small">
                        최저 <span class="min">14.6°C</span> / 최고 <span class="max">28.2°C</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>2동</h2>
                <div class="metrics">
                    <div class="metric">
                        <span class="label">평균 온도</span>
                        <span class="value temp">20.5°C</span>
                    </div>
                    <div class="metric">
                        <span class="label">평균 습도</span>
                        <span class="value hum">75.1%</span>
                    </div>
                    <div class="metric-small">
                        최저 <span class="min">14.9°C</span> / 최고 <span class="max">27.6°C</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>3동</h2>
                <div class="metrics">
                    <div class="metric">
                        <span class="label">평균 온도</span>
                        <span class="value temp">21.2°C</span>
                    </div>
                    <div class="metric">
                        <span class="label">평균 습도</span>
                        <span class="value hum">69.2%</span>
                    </div>
                    <div class="metric-small">
                        최저 <span class="min">15.8°C</span> / 최고 <span class="max">28.6°C</span>
                    </div>
                </div>
            </div>
            
            </div>
            
            <div class="footer">
                오늘도 고생 많으셨습니다! 스팜이가 내일 아침까지 하우스를 안전하게 지키겠습니다. 🚜
            </div>
        </div>
        
        <script>
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.animation = `fadeIn 0.5s ease-out ${index * 0.15 + 0.5}s forwards`;
            });
        </script>
    </body>
    </html>
